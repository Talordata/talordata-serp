identity:
  name: google_image_search
  author: talordata
  label:
    en_US: Google Images Search
    zh_Hans: Google Images Search
description:
  human:
    en_US: Call the google_images engine through Talordata SERP API.
    zh_Hans: 通过 Talordata SERP API 调用 google_images engine。
  llm: Call Talordata SERP engine google_images and return normalized or raw SERP results.
